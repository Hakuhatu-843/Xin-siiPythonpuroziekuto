<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>相場検索 | Trade Value</title>
<style>
:root{color-scheme:dark;--bg:#12151f;--panel:#1a1f2d;--panel2:#222839;--line:#2f3750;--text:#e9ecf4;--muted:#939cb3;--acc:#f2b84b;--err:#ff7b7b;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:20px;color:var(--acc);margin:0}#language{margin-left:auto}
a,.link{color:var(--acc)}.link{background:none;border:0;font:700 14px system-ui,-apple-system,"Noto Sans JP",sans-serif;cursor:pointer;padding:8px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}
h2{font-size:19px;margin:0 0 4px}.sub,.note{color:var(--muted);font-size:14px;margin:0 0 16px}
label{display:block;font-size:14px;color:var(--muted);margin:14px 0 6px}
input,select{width:100%;min-height:50px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);padding:0 12px;font:inherit}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary{width:100%;min-height:54px;margin-top:18px;border:0;border-radius:11px;background:var(--acc);color:#1b1403;font:700 17px system-ui,-apple-system,"Noto Sans JP",sans-serif;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#result{min-height:100px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.price{font-size:clamp(30px,8vw,44px);line-height:1.2;font-weight:800;color:var(--acc);overflow-wrap:anywhere}
.status{font-weight:700}.error{color:var(--err)}.muted{color:var(--muted);font-size:14px}
footer{padding:16px 4px;text-align:center;font-size:14px}
@media(min-width:520px){.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Trade Value</h1><strong id="page-title">相場検索</strong><button id="language" class="link" type="button">English</button></header>
<section class="panel">
<h2 id="heading">キャラクターの相場を調べる</h2>
<p class="sub" id="intro">レアリティ・キャラクター・レベル・変異を選んで検索します。</p>
<div class="fields">
<div><label for="rarity" id="rarity-label">レアリティ</label><select id="rarity"></select></div>
<div><label for="level" id="level-label">レベル（1〜301）</label><input id="level" type="number" min="1" max="301" step="1" value="100"></div>
</div>
<label for="search" id="search-label">キャラクター名または番号で検索</label>
<input id="search" type="search" autocomplete="off" placeholder="名前・番号で絞り込み">
<label for="character" id="character-label">キャラクター</label>
<select id="character"><option value="">キャラクター一覧を読み込み中…</option></select>
<label for="mutation" id="mutation-label">変異</label>
<select id="mutation"></select>
<button id="lookup" class="primary" type="button">相場を検索</button>
<p class="muted" id="form-error" role="alert"></p>
</section>
<section class="panel" aria-live="polite">
<h2 id="result-heading">検索結果</h2>
<div id="result"><p class="muted" id="result-placeholder">条件を選択して「相場を検索」を押してください。</p></div>
</section>
<section class="panel"><p class="note" id="method-note">相場は、審査で承認された単体取引の中央値です。選択レベルの前後20レベル以内を対象にし、3件未満の場合は相場を表示しません。まとめ買い・セット・交換のみの投稿は現在の価格計算に含みません。</p></section>
<footer><a href="./index.html" id="form-link">取引データを投稿する</a> · <a href="./admin.html" id="admin-link">審査担当者向けページ</a></footer>
</div>
<script>
const API='https://trade-value-api.hakuhatu-okuchi.workers.dev';
const rarities=[
{id:'common',ja:'コモン',en:'Common'},{id:'rare',ja:'レア',en:'Rare'},{id:'epic',ja:'エピック',en:'Epic'},
{id:'legend',ja:'レジェンド',en:'Legend'},{id:'mythic',ja:'ミシック',en:'Mythic'},{id:'secret',ja:'シークレット',en:'Secret'},
{id:'ultimate',ja:'アルティメット',en:'Ultimate'},{id:'emperor',ja:'エンペラー',en:'Emperor'}];
const mutations=[
{id:'normal',ja:'ノーマル',en:'Normal'},{id:'silver',ja:'シルバー',en:'Silver'},{id:'gold',ja:'ゴールド',en:'Gold'},
{id:'diamond',ja:'ダイヤ',en:'Diamond'},{id:'lava',ja:'ラバ',en:'Lava'},{id:'galaxy',ja:'ギャラ',en:'Galaxy'},
{id:'aqua',ja:'アクア',en:'Aqua'},{id:'yggdrasil',ja:'ユグ',en:'Yggdrasil'},{id:'halo',ja:'ハロ',en:'Halo'},{id:'rainbow',ja:'虹',en:'Rainbow'}];
const $=id=>document.getElementById(id);
let language='ja',characters=[];
const text={
ja:{title:'相場検索',heading:'キャラクターの相場を調べる',intro:'レアリティ・キャラクター・レベル・変異を選んで検索します。',
rarity:'レアリティ',level:'レベル（1〜301）',search:'キャラクター名または番号で検索',searchPlaceholder:'名前・番号で絞り込み',character:'キャラクター',mutation:'変異',
lookup:'相場を検索',searching:'検索中…',result:'検索結果',placeholder:'条件を選択して「相場を検索」を押してください。',
note:'相場は、審査で承認された単体取引の中央値です。選択レベルの前後20レベル以内を対象にし、3件未満の場合は相場を表示しません。まとめ買い・セット・交換のみの投稿は現在の価格計算に含みません。',
form:'取引データを投稿する',admin:'審査担当者向けページ',loading:'キャラクター一覧を読み込み中…',loadError:'キャラクター一覧を読み込めませんでした。ページを再読み込みしてください。',
noChars:'この条件に合うキャラクターがいません。',choose:'選択してください',invalid:'レベルは1〜301の整数で入力してください。',
notEnough:'まだ相場を表示できません',count:n=>'対象取引：'+n+'件（相場表示には3件以上必要）',range:(a,b)=>'対象レベル：Lv.'+a+'〜Lv.'+b,
value:'現在の相場（中央値）',failed:'相場を取得できませんでした。少し待って再試行してください。',badCharacter:'キャラクターを選択してください。'},
en:{title:'Market lookup',heading:'Look up a character’s market value',intro:'Choose a rarity, character, level, and mutation to search.',
rarity:'Rarity',level:'Level (1–301)',search:'Search by character name or number',searchPlaceholder:'Filter by name or number',character:'Character',mutation:'Mutation',
lookup:'Look up market value',searching:'Searching…',result:'Search result',placeholder:'Choose your criteria, then select “Look up market value”.',
note:'Market value is the median of approved single-item trades. Trades within 20 levels above or below the selected level are included. At least 3 qualifying trades are required. Bundles, sets, and exchange-only submissions are not currently included in price calculations.',
form:'Submit trade data',admin:'Reviewer page',loading:'Loading character list…',loadError:'Could not load characters. Reload the page.',
noChars:'No characters match these filters.',choose:'Choose a character',invalid:'Level must be an integer from 1 to 301.',
notEnough:'Not enough data for a market value',count:n=>'Matching trades: '+n+' (at least 3 required)',range:(a,b)=>'Included levels: Lv.'+a+'–'+b,
value:'Current market value (median)',failed:'Could not retrieve market value. Please try again shortly.',badCharacter:'Please select a character.'}
};
const t=key=>text[language][key];
function name(c){return language==='ja'?(c.characterName||c.englishName):(c.englishName||c.characterName);}
function fillStatic(){
document.documentElement.lang=language;
$('page-title').textContent=t('title');$('heading').textContent=t('heading');$('intro').textContent=t('intro');
$('rarity-label').textContent=t('rarity');$('level-label').textContent=t('level');$('search-label').textContent=t('search');
$('search').placeholder=t('searchPlaceholder');$('character-label').textContent=t('character');$('mutation-label').textContent=t('mutation');
$('lookup').textContent=t('lookup');$('result-heading').textContent=t('result');$('form-link').textContent=t('form');$('admin-link').textContent=t('admin');
$('method-note').textContent=t('note');$('language').textContent=language==='ja'?'English':'日本語';
const oldR=$('rarity').value,oldM=$('mutation').value;
$('rarity').innerHTML=rarities.map(r=>'<option value="'+r.id+'">'+r[language]+'</option>').join('');
$('mutation').innerHTML=mutations.map(m=>'<option value="'+m.id+'">'+m[language]+'</option>').join('');
if(rarities.some(r=>r.id===oldR))$('rarity').value=oldR;
if(mutations.some(m=>m.id===oldM))$('mutation').value=oldM;
if($('result').dataset.searched){lookup();}else{$('result').innerHTML='<p class="muted">'+t('placeholder')+'</p>';}
renderCharacters();
}
function renderCharacters(){
const q=$('search').value.trim().toLocaleLowerCase();
const rarity=$('rarity').value;
const list=characters.filter(c=>c.rarity===rarity&&((c.characterNumber+' '+(c.characterName||'')+' '+(c.englishName||'')).toLocaleLowerCase().includes(q)));
const current=$('character').value;
$('character').innerHTML='<option value="">'+t('choose')+'</option>'+list.map(c=>'<option value="'+c.characterNumber+'">'+c.characterNumber+' / '+escapeHtml(name(c))+'</option>').join('');
if(list.some(c=>c.characterNumber===current))$('character').value=current;
if(!list.length)$('character').innerHTML='<option value="">'+t('noChars')+'</option>';
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadCharacters(){
try{
const res=await fetch(API+'/characters',{headers:{Accept:'application/json'}});
const data=await res.json();
if(!res.ok||!data.ok||!Array.isArray(data.characters))throw new Error('Invalid response');
characters=data.characters.filter(c=>c&&/^\d{3}$/.test(c.characterNumber)&&typeof c.characterId==='string'&&typeof c.rarity==='string');
renderCharacters();
}catch{
$('character').innerHTML='<option value="">'+t('loadError')+'</option>';
}
}
async function lookup(){
$('form-error').textContent='';
const characterId=$('character').value,level=Number($('level').value),mutation=$('mutation').value;
if(!characterId){$('form-error').textContent=t('badCharacter');return;}
if(!Number.isInteger(level)||level<1||level>301){$('form-error').textContent=t('invalid');return;}
const btn=$('lookup');btn.disabled=true;btn.textContent=t('searching');
$('result').dataset.searched='1';$('result').innerHTML='<p class="muted">'+t('searching')+'</p>';
try{
const url=API+'/market-value?'+new URLSearchParams({characterId,mutation,level:String(level)});
const res=await fetch(url,{headers:{Accept:'application/json'}});
const data=await res.json();
if(!res.ok||!data.ok)throw new Error(data.error||'Request failed');
const min=Math.max(1,level-20),max=Math.min(301,level+20);
if(data.status==='ok'&&Number.isFinite(Number(data.marketValue))){
$('result').innerHTML='<div class="price">'+Number(data.marketValue).toLocaleString(language==='ja'?'ja-JP':'en-US')+'</div><div class="status">'+t('value')+'</div><div class="muted">'+t('count')(data.sampleCount)+'</div><div class="muted">'+t('range')(min,max)+'</div>';
}else{
$('result').innerHTML='<div class="status">'+t('notEnough')+'</div><div class="muted">'+t('count')(Number(data.sampleCount)||0)+'</div><div class="muted">'+t('range')(min,max)+'</div>';
}
}catch{
$('result').innerHTML='<p class="error">'+t('failed')+'</p>';
}finally{btn.disabled=false;btn.textContent=t('lookup');}
}
$('language').addEventListener('click',()=>{language=language==='ja'?'en':'ja';fillStatic();});
$('rarity').addEventListener('change',renderCharacters);
$('search').addEventListener('input',renderCharacters);
$('lookup').addEventListener('click',lookup);
fillStatic();loadCharacters();
</script>
</body>
</html>
