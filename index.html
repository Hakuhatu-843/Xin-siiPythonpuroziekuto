<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>取引データ入力 | Trade Value</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#12151f;--panel:#1a1f2d;--panel2:#222839;--line:#2f3750;--text:#e9ecf4;--muted:#939cb3;--acc:#f2b84b;--ink:#1b1403;--err:#ff7b7b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.6 "Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 0}
header{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;flex-wrap:wrap}
#language{margin-left:auto}
h1{font-size:18px;margin:0;color:var(--acc)}header p{margin:0;color:var(--muted);font-size:14px}
#prog .segs{display:flex;gap:4px}#prog .segs i{flex:1;height:6px;border-radius:3px;background:var(--line)}
#prog .segs i.d{background:#6b5a2e}#prog .segs i.c{background:var(--acc)}
#prog p{display:flex;justify-content:space-between;margin:8px 0 0;font-size:14px;color:var(--muted)}#prog b{color:var(--text)}
main{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 16px 0;margin-top:14px}
footer{padding:12px 4px 24px;text-align:center;font-size:13px}
footer a{color:var(--muted)}
h2{font-size:22px;line-height:1.4;margin:0 0 4px}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}h2+.list,h2+.grid{margin-top:14px}
.slot{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:0 10px;font-size:13px;color:var(--acc);margin-bottom:8px}
.list,.grid{display:grid;gap:10px}.grid{grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.grid.c3{grid-template-columns:repeat(3,1fr)}}
.opt{display:block;width:100%;min-height:60px;text-align:left;background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 16px;font:700 16px/1.4 "Noto Sans JP",sans-serif;cursor:pointer}
.opt small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.opt[style*="--c"]{border-left:8px solid var(--c)}
.opt[aria-pressed=true]{border-color:var(--c,var(--acc));background:color-mix(in srgb,var(--c,var(--acc)) 18%,var(--bg))}
.opt[aria-pressed=true]::after{content:"✓";float:right;color:var(--c,var(--acc))}
.txt{width:100%;min-height:56px;background:var(--bg);border:2px solid var(--line);border-radius:12px;color:var(--text);padding:0 14px;font:700 20px "Noto Sans JP",sans-serif;font-variant-numeric:tabular-nums}
.txt:focus-visible,.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.link:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.txt[aria-invalid=true]{border-color:var(--err)}
#q{font:500 16px "Noto Sans JP",sans-serif;margin:14px 0 12px}
.num{display:flex;gap:10px;margin-top:14px}.num .txt{text-align:center}
.step{flex:none;width:56px;min-height:56px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);color:var(--text);font:700 24px sans-serif;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:500 15px "Noto Sans JP",sans-serif;cursor:pointer}
.err{min-height:1.6em;margin:10px 0 0;color:var(--err);font-size:14px;font-weight:700}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:20px 0}
.preview{margin:8px 0 0;color:var(--muted);font-size:14px}
.bar{position:sticky;bottom:0;display:flex;gap:12px;padding:12px 0 14px;background:linear-gradient(rgba(26,31,45,0),var(--panel) 22%)}
.btn{flex:1;min-height:56px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font:700 17px/1.2 "Noto Sans JP",sans-serif;cursor:pointer}
.btn.primary{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btn.ghost{flex:0 0 34%}.btn.wide{width:100%;margin-top:14px;flex:none}
.btn:disabled{opacity:.5}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row span{color:var(--muted);font-size:14px}.row b{text-align:right}
.card2{background:var(--panel2);border-radius:12px;padding:6px 14px 8px;margin:10px 0;border-left:8px solid var(--c)}
.card2 .row:last-child{border-bottom:0}
.link{background:none;border:0;color:var(--acc);font:700 14px "Noto Sans JP",sans-serif;min-height:44px;padding:0 6px;cursor:pointer}
.link.del{color:var(--err)}
.price{font-size:26px;color:var(--acc);font-variant-numeric:tabular-nums}
.done{text-align:center;padding:12px 0 4px}
.done .ok{width:72px;height:72px;margin:0 auto 12px;border-radius:50%;background:#1f4d3d;color:#6ee7b7;font-size:36px;line-height:72px}
details{margin:12px 0;color:var(--muted);font-size:13px;text-align:left}pre{overflow-x:auto;background:var(--bg);padding:10px;border-radius:8px;color:var(--text)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Trade Value</h1><p id="page-subtitle">取引データ入力</p><button type="button" class="link" id="language">English</button></header>
  <div id="prog" role="group"></div>
  <main id="app"></main>
  <footer><a href="./admin.html">審査担当者向けページ</a></footer>
</div>

<script>
/* Form choices are loaded from the Worker; character numbers are not duplicated here. */
const MASTER = {
  maxItems: 3,                                   // まとめ買い・セットの最大キャラクター数
  levels: { min: 1, max: 301, presets: [1, 10, 50, 100, 200, 301] },
  tradeTypes: [
    { id: 'single', label: ['単体', 'Single'], desc: ['1キャラクターの取引', 'One character'], multi: false, priceLabel: ['取引価格', 'Trade price'] },
    { id: 'bundle', label: ['まとめ買い', 'Bundle'], desc: ['最大3キャラクターを1つの取引として登録', 'Up to 3 characters in one bulk trade'], multi: true, priceLabel: ['まとめ買い全体の価格', 'Total bundle price'] },
    { id: 'set', label: ['セット', 'Set'], desc: ['最大3キャラクターのセットを登録', 'A set of up to 3 characters'], multi: true, priceLabel: ['セット全体の価格', 'Total set price'] },
    { id: 'exchange', label: ['交換のみ', 'Exchange only'], desc: ['金額を登録せず、交換内容だけを記録', 'Record the exchange without inventing a price'], multi: true }
  ],
  rarities: [
    { id: 'common', label: ['コモン', 'Common'], color: '#9be23c' },
    { id: 'rare', label: ['レア', 'Rare'], color: '#3b8cff' },
    { id: 'epic', label: ['エピック', 'Epic'], color: '#a259ff' },
    { id: 'legend', label: ['レジェンド', 'Legend'], color: '#ff9f43' },
    { id: 'mythic', label: ['ミシック', 'Mythic'], color: '#ff4d4d' },
    { id: 'secret', label: ['シークレット', 'Secret'], color: '#4b4f5c' },
    { id: 'ultimate', label: ['アルティメット', 'Ultimate'], color: '#ffd24a' },
    { id: 'emperor', label: ['エンペラー', 'Emperor'], color: '#8f1d2c' }
  ],
  mutations: [
    { id: 'normal', label: ['ノーマル', 'Normal'], color: '#f1f3f8' },
    { id: 'silver', label: ['シルバー', 'Silver'], color: '#9aa0ab' },
    { id: 'gold', label: ['ゴールド', 'Gold'], color: '#ffe14d' },
    { id: 'diamond', label: ['ダイヤ', 'Diamond'], color: '#5fe0f0' },
    { id: 'lava', label: ['ラバ', 'Lava'], color: '#ff5a2e' },
    { id: 'galaxy', label: ['ギャラ', 'Galaxy'], color: '#a259ff' },
    { id: 'aqua', label: ['アクア', 'Aqua'], color: '#3b7bff' },
    { id: 'yggdrasil', label: ['ユグ', 'Yggdrasil'], color: '#4cd964' },
    { id: 'halo', label: ['ハロ', 'Halo'], color: '#ff9f43' },
    { id: 'rainbow', label: ['虹', 'Rainbow'], color: '#d946ef' }
  ],
  characters: []
};

const API_BASE = 'https://trade-value-api.hakuhatu-okuchi.workers.dev';
async function submitTrade(payload, endpoint = '/trades') {
  let response;
  const controller = new AbortController();
  let timedOut = false;
  const timeoutId = window.setTimeout(() => {
    timedOut = true;
    controller.abort();
  }, 10000);
  try {
    response = await fetch(`${API_BASE}${endpoint}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
  } catch (error) {
    if (timedOut || error?.name === 'TimeoutError' || error?.name === 'AbortError') {
      throw new Error(t('送信がタイムアウトしました。同じ内容で再試行できます。', 'The request timed out. You can retry the same submission.'));
    }
    throw new Error(t('Worker APIに接続できませんでした。通信を確認してください。', 'Could not connect to the Worker API. Check your connection.'));
  } finally {
    window.clearTimeout(timeoutId);
  }
  const data = await response.json().catch(() => null);
  if (!response.ok || !data?.ok) {
    const errors = {
      'Character number not found': ['未登録のキャラクター番号です。', 'That character number is not registered.'],
      'Too many submissions. Please try again later.': ['送信回数が上限に達しました。時間をおいて再度お試しください。', 'Too many submissions. Please try again later.'],
      'Please wait 5 seconds before submitting again.': ['連続送信を防ぐため、5秒待ってから再送信してください。', 'Please wait 5 seconds before submitting again.'],
      'Repeated identical submissions blocked this IP.': ['同じ内容の連続送信が検出されたため、このIPからの送信を制限しました。', 'Repeated identical submissions blocked this IP.'],
      'Access blocked': ['このネットワークからの送信は制限されています。', 'Submissions from this network are restricted.'],
      'Invalid total price': ['取引価格を確認してください。', 'Check the trade price.'],
      'Invalid exchange description': ['交換内容を入力してください。', 'Enter the exchange details.'],
      'Invalid trade item': ['キャラクター・レベル・変異・個数を確認してください。', 'Check the character, level, mutation, and quantity.']
    };
    const message = errors[data?.error]?.[S.language === 'ja' ? 0 : 1];
    throw new Error(message || (data?.error
      ? t(`送信内容を確認してください: ${data.error}`, `Check the submission: ${data.error}`)
      : t('送信に失敗しました。時間をおいて再度お試しください。', 'Submission failed. Please try again later.')));
  }
  return data;
}

/* ===================== 状態管理 ===================== */
const M = MASTER, L = M.levels;
const STEPS = ['type', 'rarity', 'char', 'level', 'mut', 'qty', 'price', 'exchange', 'confirm'];
const LABEL = {
  type: ['取引タイプ', 'Trade type'], exchange: ['交換内容', 'Exchange details'], rarity: ['レアリティ', 'Rarity'],
  char: ['キャラクター番号', 'Character number'], level: ['レベル', 'Level'],
  mut: ['変異', 'Mutation'], qty: ['個数', 'Quantity'],
  price: ['価格', 'Price'], confirm: ['確認', 'Review']
};
let S;
let submitCooldownUntil = 0;
let submitCooldownTimer = null;
const fresh = () => { S = { step: 'type', type: null, items: [], cur: 0, price: '', exchangeDescription: '', touched: false, live: false, q: '', fromConfirm: false, last: null, submissionId: null, language: S?.language || 'ja', charactersLoaded: false, charactersError: false }; };
const $ = s => document.querySelector(s);
const byId = (a, id) => a.find(x => x.id === id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const tr = value => Array.isArray(value) ? value[S.language === 'ja' ? 0 : 1] : value;
const t = (ja, en) => S.language === 'ja' ? ja : en;
const tType = () => S.type ? byId(M.tradeTypes, S.type) : null;
const isMulti = () => !!(tType() && tType().multi);
const activeSteps = () => S.type === 'exchange'
  ? STEPS.filter(step => step !== 'price')
  : STEPS.filter(step => step !== 'exchange');
const item = () => S.items[S.cur];
const newItem = () => ({ rarity: null, char: null, level: '', mut: null, qty: '1' });
const get = f => f === 'price' ? S.price : item()[f];
const set = (f, v) => { if (f === 'price') S.price = v; else item()[f] = v; };
const fmt = n => Number(n).toLocaleString(S.language === 'ja' ? 'ja-JP' : 'en-US');
const characterDisplayName = character => S.language === 'ja'
  ? (character.characterName || character.englishName || character.characterNumber)
  : (character.englishName || character.characterName || character.characterNumber);

function validate(step) {
  const it = S.items[S.cur];
  switch (step) {
    case 'type': return S.type ? '' : t('取引タイプを選んでください', 'Choose a trade type.');
    case 'rarity': return it.rarity ? '' : t('レアリティを選んでください', 'Choose a rarity.');
    case 'char': return it.char ? '' : t('キャラクター番号を選んでください', 'Choose a character number.');
    case 'level': { const n = Number(it.level); return it.level !== '' && Number.isInteger(n) && n >= L.min && n <= L.max ? '' : t(`レベルは${L.min}〜${L.max}の整数で入力してください`, `Level must be an integer from ${L.min} to ${L.max}.`); }
    case 'mut': return it.mut ? '' : t('変異を選んでください', 'Choose a mutation.');
    case 'qty': return /^[1-9]\d*$/.test(it.qty) ? '' : t('個数は1以上の整数で入力してください', 'Quantity must be a positive integer.');
    case 'price': { const price = Number(S.price); return /^[1-9]\d*$/.test(S.price) && price <= 2_000_000_000 ? '' : t('取引価格は1〜2,000,000,000の整数で入力してください', 'Trade price must be an integer between 1 and 2,000,000,000.'); }
    case 'exchange': return typeof S.exchangeDescription === 'string' && S.exchangeDescription.trim().length > 0 && S.exchangeDescription.trim().length <= 1000 ? '' : t('交換内容を1〜1000文字で入力してください', 'Describe the exchange in 1 to 1000 characters.');
  }
  return '';
}

/* ===================== 画面部品 ===================== */
const opt = (v, html, sel, st = '') => `<button type="button" class="opt" data-v="${v}" aria-pressed="${sel}" style="${st}">${html}</button>`;
const bar = (back = true, label = t('次へ', 'Next')) => `<div class="bar">${back ? `<button type="button" class="btn ghost" data-a="back">${t('戻る', 'Back')}</button>` : ''}<button type="button" class="btn primary" data-a="next">${label}</button></div>`;
const head = (title, sub) => `${isMulti() && S.step !== 'type' ? `<span class="slot">${t('キャラクター', 'Character')} ${S.cur + 1} / ${M.maxItems}</span>` : ''}<h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}`;
const errP = '<p class="err" id="err" role="alert"></p>';
const num = (f, val, hint) => `<div class="num"><button type="button" class="step" data-f="${f}" data-d="-1" aria-label="${t('1減らす', 'Decrease by 1')}">−</button><input class="txt" data-f="${f}" inputmode="numeric" autocomplete="off" value="${val}" placeholder="${hint}"><button type="button" class="step" data-f="${f}" data-d="1" aria-label="${t('1増やす', 'Increase by 1')}">＋</button></div>`;

const VIEWS = {
  type: () => head(t('取引タイプを選択', 'Choose trade type')) + `<div class="list">${M.tradeTypes.map(type => opt(type.id, `${tr(type.label)}<small>${tr(type.desc)}</small>`, S.type === type.id)).join('')}</div>` + errP + bar(false),
  rarity: () => head(t('レアリティを選択', 'Choose rarity')) + `<div class="grid">${M.rarities.map(r => opt(r.id, tr(r.label), item().rarity === r.id, `--c:${r.color}`)).join('')}</div>` + errP + bar(),
  char: () => head(t('キャラクター番号を選択', 'Choose character number'), t(`${tr(byId(M.rarities, item().rarity).label)}のキャラクターのみ表示しています`, `Showing ${tr(byId(M.rarities, item().rarity).label)} characters only`)) +
    `<input class="txt" id="q" type="search" placeholder="${t('番号または名前で検索', 'Search number or name')}" value="${esc(S.q)}" autocomplete="off" aria-label="${t('キャラクター検索', 'Search characters')}"><div id="chars" class="grid c3"></div>` + errP + bar(),
  level: () => head(t('レベルを入力', 'Enter level'), t('取引価格に影響するため必須です', 'Required to describe the trade.')) + num('level', item().level, `${L.min}–${L.max}`) +
    `<div class="chips">${L.presets.map(p => `<button type="button" class="chip" data-p="${p}">Lv.${p}</button>`).join('')}</div>` + errP + bar(),
  mut: () => head(t('変異を選択', 'Choose mutation')) + `<div class="grid">${M.mutations.map(m => opt(m.id, tr(m.label), item().mut === m.id, `--c:${m.color}`)).join('')}</div>` + errP + bar(),
  qty: () => head(t('個数を入力', 'Enter quantity'), t('1以上の整数', 'Positive integer')) + num('qty', item().qty, '1') +
    (isMulti() && S.items.length < M.maxItems ? `<button type="button" class="btn wide" data-a="add">＋ ${t('キャラクターを追加', 'Add character')} (${S.items.length}/${M.maxItems})</button>` : '') +
    errP + bar(true, isMulti() ? t('価格入力へ', 'Enter price') : t('次へ', 'Next')),
  price: () => head(`${tr(tType().priceLabel)}${t('を入力', '')}`, isMulti() ? t('キャラクターごとではなく、全体の価格を1つ入力します', 'Enter one total price, not a price per character.') : t('この取引全体の価格を入力します', 'Enter the total price for this trade.')) +
    `<input class="txt" data-f="price" inputmode="numeric" autocomplete="off" placeholder="${t('例: 15000', 'Example: 15000')}" value="${S.price}" aria-label="${tr(tType().priceLabel)}"><p class="preview" id="pv">${S.price ? fmt(S.price) : ''}</p>` + errP + bar(),
  exchange: () => head(t('交換内容を入力', 'Describe the exchange'), t('価格は入力・保存せず、交換内容を相場計算にも含めません', 'No price is entered or stored, and exchanges are excluded from market calculations.')) +
    `<textarea class="txt" id="exchange-description" maxlength="1000" rows="4" aria-label="${t('交換内容', 'Exchange details')}" placeholder="${t('例: フェニックスとの交換', 'e.g. Exchange for a Phoenix')}">${esc(S.exchangeDescription)}</textarea>` + errP + bar(),
  confirm: () => {
    const tradeType = tType();
    const items = S.items.map((it, i) => {
      const r = byId(M.rarities, it.rarity), c = M.characters.find(character => character.characterNumber === it.char), m = byId(M.mutations, it.mut);
      return `<div class="card2" style="--c:${r.color}"><div class="row"><b>${esc(c.characterNumber)} / ${esc(characterDisplayName(c))} (${tr(r.label)})</b><span>${isMulti() && S.items.length > 1 ? `<button type="button" class="link del" data-a="del" data-i="${i}">${t('削除', 'Remove')}</button>` : ''}<button type="button" class="link" data-a="edit" data-to="rarity" data-i="${i}">${t('変更', 'Edit')}</button></span></div>
        <div class="row"><span>${t('レベル', 'Level')}</span><b>Lv.${it.level}</b></div><div class="row"><span>${t('変異', 'Mutation')}</span><b>${tr(m.label)}</b></div><div class="row"><span>${t('個数', 'Quantity')}</span><b>×${fmt(it.qty)}</b></div></div>`;
    }).join('');
    return `<h2>${t('内容を確認', 'Review trade')}</h2><p class="sub">${t('この内容で送信します', 'Submit this trade with the details below.')}</p>
      <div class="row"><span>${t('取引タイプ', 'Trade type')}</span><b>${tr(tradeType.label)} <button type="button" class="link" data-a="edit" data-to="type" data-i="0">${t('変更', 'Edit')}</button></b></div>${items}
      ${S.type === 'exchange'
        ? `<div class="row"><span>${t('交換内容', 'Exchange details')}</span><b>${esc(S.exchangeDescription)} <button type="button" class="link" data-a="edit" data-to="exchange" data-i="${S.items.length - 1}">${t('変更', 'Edit')}</button></b></div>`
        : `<div class="row"><span>${tr(tradeType.priceLabel)}</span><b class="price">${fmt(S.price)} <button type="button" class="link" data-a="edit" data-to="price" data-i="${S.items.length - 1}">${t('変更', 'Edit')}</button></b></div>`}
      <p class="err" id="err" role="alert"></p>
      <div class="bar"><button type="button" class="btn ghost" data-a="fix">${t('修正する', 'Edit trade')}</button><button type="button" class="btn primary" data-a="submit">${t('送信する', 'Submit')}</button></div>`;
  },
  done: () => `<div class="done"><div class="ok" aria-hidden="true">✓</div><h2>${t('取引データを送信しました', 'Trade submitted')}</h2><p class="sub">${t('ご協力ありがとうございます。取引は審査後に相場へ反映されます。', 'Thank you. Your trade will be considered for market data after review.')}</p></div>
    <div class="bar"><button type="button" class="btn primary" data-a="reset">${t('最初の画面へ戻る', 'Start another trade')}</button></div>`
};

/* ===================== 描画・操作 ===================== */
function render(top) {
  const done = S.step === 'done', p = $('#prog');
  document.documentElement.lang = S.language;
  document.title = t('取引データ入力 | Trade Value', 'Submit a trade | Trade Value');
  $('#page-subtitle').textContent = t('取引データ入力', 'Trade submission');
  $('#language').textContent = S.language === 'ja' ? 'English' : '日本語';
  p.hidden = done;
  if (!done) {
    const steps = activeSteps(), i = steps.indexOf(S.step);
    p.setAttribute('aria-label', t(`ステップ ${i + 1} / ${steps.length}`, `Step ${i + 1} of ${steps.length}`));
    p.innerHTML = `<div class="segs">${steps.map((s, k) => `<i class="${k < i ? 'd' : k === i ? 'c' : ''}"></i>`).join('')}</div><p><b>${tr(LABEL[S.step])}</b><span>${t('ステップ', 'Step')} ${i + 1} / ${steps.length}</span></p>`;
  }
  $('#app').innerHTML = VIEWS[S.step]();
  if (S.step === 'char') fillChars();
  refreshErr();
  if (top) window.scrollTo(0, 0);
}
function fillChars() {
  const it = item(), q = S.q.trim().toLowerCase();
  if (!S.charactersLoaded) {
    $('#chars').innerHTML = `<p class="empty">${S.charactersError ? t('キャラクター一覧を読み込めません。接続を確認して再読み込みしてください。', 'Could not load the character list. Check your connection and reload.') : t('キャラクター一覧を読み込み中です…', 'Loading characters…')}</p>`;
    return;
  }
  const l = M.characters.filter(c => c.rarity === it.rarity &&
    `${c.characterNumber} ${c.characterName || ''} ${c.englishName || ''}`.toLowerCase().includes(q));
  $('#chars').innerHTML = l.length
    ? l.map(c => opt(c.characterNumber, `${esc(c.characterNumber)} / ${esc(characterDisplayName(c))}`, it.char === c.characterNumber, `--c:${byId(M.rarities, it.rarity).color}`)).join('')
    : `<p class="empty">${t('該当するキャラクターがいません', 'No matching characters.')}</p>`;
}
async function loadCharacters() {
  try {
    const response = await fetch(`${API_BASE}/characters`, { headers: { Accept: 'application/json' } });
    const payload = await response.json();
    if (!response.ok || payload?.ok !== true || !Array.isArray(payload.characters)) {
      throw new Error('Invalid character catalog response');
    }
    M.characters = payload.characters.filter(c =>
      typeof c.characterNumber === 'string' && /^\d{3}$/.test(c.characterNumber) &&
      typeof c.characterId === 'string' && typeof c.characterName === 'string' &&
      M.rarities.some(r => r.id === c.rarity)
    );
    S.charactersLoaded = true;
  } catch {
    S.charactersError = true;
  }
  if (S.step === 'char') fillChars();
}
function refreshErr() {
  const el = $('#err'); if (!el || S.step === 'confirm') return;
  const e = validate(S.step), show = (S.touched || S.live) && e;
  el.textContent = show ? e : '';
  document.querySelectorAll('input[data-f], textarea#exchange-description').forEach(i => i.setAttribute('aria-invalid', show ? 'true' : 'false'));
}
function go(step) {
  S.step = step; S.touched = false; S.live = false; S.q = '';
  if (step === 'confirm') S.fromConfirm = false;
  render(true);
}
function setField(f, v) {
  if (get(f) !== v) S.submissionId = null;
  set(f, v); S.live = true;
  const inp = document.querySelector(`input[data-f="${f}"]`); if (inp) inp.value = v;
  const pv = $('#pv'); if (pv) pv.textContent = f === 'price' && v ? fmt(v) : '';
  refreshErr();
}
function choose(v) {
  const it = S.items[S.cur];
  S.submissionId = null;
  if (S.step === 'type') S.type = v;
  else if (S.step === 'rarity') { if (it.rarity !== v) it.char = null; it.rarity = v; }
  else if (S.step === 'char') it.char = v;
  else if (S.step === 'mut') it.mut = v;
  S.touched = false; render(false);
}
function next() {
  S.touched = true;
  if (S.step === 'type' && !validate('type')) { if (!S.items.length) S.items = [newItem()]; if (!isMulti()) S.items.length = 1; S.cur = Math.min(S.cur, S.items.length - 1); }
  const e = validate(S.step); if (e) { refreshErr(); return; }
  const steps = activeSteps();
  let to = steps[steps.indexOf(S.step) + 1];
  if (S.fromConfirm) {
    if (S.step === 'type') to = S.type === 'exchange' ? 'exchange' : 'price';
    else if (S.step === 'rarity' && !item().char) to = 'char';
    else to = 'confirm';
  }
  go(to);
}
function back() {
  if (S.fromConfirm) { go('confirm'); return; }
  const steps = activeSteps(), i = steps.indexOf(S.step);
  if (S.step === 'rarity' && S.cur > 0) { S.cur--; go('qty'); return; }
  if (S.step === 'price') S.cur = S.items.length - 1;
  go(steps[i - 1]);
}
function startSubmitCooldown(btn) {
  submitCooldownUntil = Date.now() + 5000;
  if (submitCooldownTimer !== null) window.clearTimeout(submitCooldownTimer);
  const originalLabel = t('送信する', 'Submit');
  const tick = () => {
    const remaining = Math.max(0, submitCooldownUntil - Date.now());
    if (!btn.isConnected) {
      if (remaining > 0) submitCooldownTimer = window.setTimeout(tick, Math.min(250, remaining));
      else submitCooldownTimer = null;
      return;
    }
    if (remaining > 0) {
      btn.disabled = true;
      btn.textContent = `${originalLabel} (${Math.ceil(remaining / 1000)}s)`;
      submitCooldownTimer = window.setTimeout(tick, Math.min(250, remaining));
    } else {
      btn.disabled = false;
      btn.textContent = originalLabel;
      submitCooldownTimer = null;
    }
  };
  tick();
}

async function submit(btn) {
  if (Date.now() < submitCooldownUntil) {
    btn.disabled = true;
    $('#err').textContent = t('送信クールタイム中です。少し待ってください。', 'Submission cooldown active. Please wait a moment.');
    return;
  }
  startSubmitCooldown(btn);
  if (!S.submissionId) {
    if (!globalThis.crypto?.randomUUID) {
      $('#err').textContent = t('安全な送信IDを作成できません。HTTPSで開き直してください。', 'A secure submission ID could not be created. Open this page over HTTPS.');
      return;
    }
    S.submissionId = crypto.randomUUID();
  }
  const payload = {
    submissionId: S.submissionId,
    items: S.items.map(i => ({ rarity: i.rarity, characterNumber: i.char, level: Number(i.level), mutation: i.mut, quantity: Number(i.qty) }))
  };
  if (S.type === 'exchange') payload.exchangeDescription = S.exchangeDescription.trim();
  else Object.assign(payload, { tradeType: S.type, totalPrice: Number(S.price) });
  S.last = payload;
  try { S.last = { ...S.last, ...await submitTrade(S.last, S.type === 'exchange' ? '/exchanges' : '/trades') }; go('done'); }
  catch (e) { $('#err').textContent = e instanceof Error ? e.message : t('送信に失敗しました。もう一度お試しください。', 'Submission failed. Please try again.'); }
}

const app = $('#app');
$('#language').addEventListener('click', () => {
  S.language = S.language === 'ja' ? 'en' : 'ja';
  render(false);
});
app.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (d.v !== undefined) return choose(d.v);
  if (d.p) return setField('level', d.p);
  if (d.d) { const f = d.f, min = f === 'level' ? L.min : 1, max = f === 'level' ? L.max : 9999; return setField(f, String(Math.min(max, Math.max(min, Number(get(f) || 0) + Number(d.d))))); }
  switch (d.a) {
    case 'next': return next();
    case 'back': return back();
    case 'add': S.touched = true; if (validate('qty')) return refreshErr(); S.submissionId = null; S.items.push(newItem()); S.cur = S.items.length - 1; return go('rarity');
    case 'edit': S.fromConfirm = true; S.cur = Number(d.i); return go(d.to);
    case 'del': S.submissionId = null; S.items.splice(Number(d.i), 1); S.cur = 0; return render(false);
    case 'fix': S.fromConfirm = false; S.cur = 0; return go('type');
    case 'submit': return submit(t);
    case 'reset': fresh(); return render(true);
  }
});
app.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'q') { S.q = el.value; return fillChars(); }
  if (el.id === 'exchange-description') {
    if (S.exchangeDescription !== el.value) S.submissionId = null;
    S.exchangeDescription = el.value;
    S.live = true;
    refreshErr();
    return;
  }
  const f = el.dataset.f; if (!f) return;
  const v = el.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 65248)).replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, f === 'price' ? 12 : f === 'level' ? 3 : 4);
  setField(f, v);
});
app.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input[data-f]')) { e.preventDefault(); next(); } });

fresh(); render(false);
loadCharacters();
</script>
</body>
