<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://trade-value-api.hakuhatu-okuchi.workers.dev; form-action 'none'; base-uri 'none'">
<title>取引統計 | Trade Value</title>
<style>
:root{color-scheme:dark;--bg:#12151f;--panel:#1a1f2d;--panel2:#222839;--line:#343d55;--text:#e9ecf4;--muted:#a5aec3;--accent:#f2b84b;--danger:#ff8989;--success:#75deb2;font:16px/1.55 system-ui,-apple-system,"Noto Sans JP",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input{font:inherit}button,input{min-height:44px}button{border:1px solid var(--line);border-radius:9px;padding:8px 14px;background:var(--panel2);color:var(--text);font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);color:var(--text)}:focus-visible{outline:3px solid #ffe19a;outline-offset:2px}
.wrap{width:min(100% - 24px,1000px);margin:0 auto;padding:18px 0 max(28px,env(safe-area-inset-bottom))}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:1.4rem;margin:0;color:var(--accent)}h2{font-size:1.1rem;margin:.25rem 0}p{margin:.5rem 0}.muted,.hint{color:var(--muted);font-size:.92rem}.back{color:var(--accent);text-decoration:none}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}.auth{max-width:560px;margin:24px auto}label{display:block;font-weight:700;margin:12px 0 5px}.notice{border-left:4px solid var(--accent);padding:8px 11px;background:var(--panel2);border-radius:4px;color:var(--muted)}.error{color:var(--danger);font-weight:700;min-height:1.5em}.hidden{display:none!important}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.stat{background:var(--panel2);border-radius:10px;padding:12px;min-width:0}.stat small{display:block;color:var(--muted)}.stat strong{font-size:1.6rem;font-variant-numeric:tabular-nums}.section-title{margin:22px 0 8px}.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}th{background:var(--panel2);color:var(--muted);font-size:.9rem}td.num{text-align:right;font-variant-numeric:tabular-nums}tbody tr:last-child td{border-bottom:0}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px}.toolbar span{color:var(--muted);font-size:.9rem}.empty{text-align:center;color:var(--muted);padding:20px}.foot{color:var(--muted);font-size:.85rem;margin-top:14px}@media(min-width:650px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.cards.secondary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:420px){.wrap{width:min(100% - 16px,1000px);padding-top:10px}.panel{padding:12px}.stat{padding:10px}.stat strong{font-size:1.35rem}}
</style>
</head>
<body>
<main class="wrap">
<header><div><h1>Trade Value — 取引統計</h1><p class="muted">データの蓄積状況を確認します。</p></div><a class="back" href="./admin.html">審査ページへ</a></header>
<section id="auth-panel" class="panel auth">
<h2>審査担当者の認証</h2>
<p class="notice">統計データの閲覧には審査専用キーが必要です。キーはこのページのメモリ内だけで使用し、保存しません。</p>
<form id="auth-form">
<label for="reviewer">担当者名（表示用）</label><input id="reviewer" maxlength="100" autocomplete="off" required>
<label for="key">審査専用キー</label><input id="key" type="password" autocomplete="off" spellcheck="false" required>
<p id="auth-error" class="error" role="alert"></p>
<div class="actions"><button type="submit" id="login-button">統計を読み込む</button></div>
</form>
</section>
<section id="dashboard" class="hidden">
<div class="panel">
<div class="toolbar"><div><h2>収集状況</h2><p id="updated" class="muted">未更新</p></div><button id="refresh-button" type="button">再読み込み</button></div>
<div class="cards" id="trade-cards"></div>
<h2 class="section-title">交換のみの申請</h2><div class="cards secondary" id="exchange-cards"></div>
<div class="cards secondary">
<div class="stat"><small>確認済みキャラデータ</small><strong id="verified-items">—</strong></div>
<div class="stat"><small>データがあるキャラ数</small><strong id="character-count">—</strong></div>
<div class="stat"><small>取引＋交換申請の合計</small><strong id="all-submissions">—</strong></div>
</div>
</div>
<div class="panel">
<h2>キャラごとのデータ件数</h2>
<p class="muted">承認済みで、キャラ確認済みの通常取引のみを集計。取引件数は同じ取引内の重複を除いて数えます。</p>
<div class="toolbar"><input id="search" type="search" placeholder="キャラIDで検索" aria-label="キャラIDで検索"><span id="shown-count"></span></div>
<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>キャラID</th><th>取引件数</th><th>個数合計</th><th>最終申請日時</th></tr></thead><tbody id="character-rows"><tr><td colspan="4" class="empty">読み込み中</td></tr></tbody></table></div>
<p class="foot">このページは統計表示専用です。投稿の承認・却下は審査ページで行ってください。</p>
</div>
</section>
</main>
<script>
(() => {
  const API = "https://trade-value-api.hakuhatu-okuchi.workers.dev";
  const $ = (id) => document.getElementById(id);
  let reviewKey = "";
  let characters = [];
  const fmt = (n) => Number(n || 0).toLocaleString("ja-JP");
  const safeText = (value) => String(value ?? "");
  function statCard(label, value) {
    const card = document.createElement("div");
    card.className = "stat";
    const small = document.createElement("small");
    small.textContent = label;
    const strong = document.createElement("strong");
    strong.textContent = fmt(value);
    card.append(small, strong);
    return card;
  }
  function renderCards(id, entries) {
    const container = $(id);
    container.replaceChildren();
    for (const [label, value] of entries) container.append(statCard(label, value));
  }
  function renderCharacters() {
    const query = $("search").value.trim().toLocaleLowerCase();
    const filtered = characters.filter((c) => safeText(c.characterId).toLocaleLowerCase().includes(query));
    const tbody = $("character-rows");
    tbody.replaceChildren();
    $("shown-count").textContent = filtered.length.toLocaleString("ja-JP") + " / " + characters.length.toLocaleString("ja-JP") + " キャラ";
    if (!filtered.length) {
      const tr = document.createElement("tr");
      const td = document.createElement("td");
      td.colSpan = 4;
      td.className = "empty";
      td.textContent = "該当するデータがありません";
      tr.append(td); tbody.append(tr); return;
    }
    for (const c of filtered) {
      const tr = document.createElement("tr");
      for (const [value, cls] of [
        [c.characterId, ""],
        [fmt(c.tradeCount), "num"],
        [fmt(c.itemCount), "num"],
        [c.lastSubmittedAt ? new Date(c.lastSubmittedAt).toLocaleString("ja-JP") : "—", ""]
      ]) {
        const td = document.createElement("td");
        td.textContent = safeText(value);
        if (cls) td.className = cls;
        tr.append(td);
      }
      tbody.append(tr);
    }
  }
  async function loadStatistics() {
    $("refresh-button").disabled = true;
    $("auth-error").textContent = "";
    try {
      const response = await fetch(API + "/admin/statistics", {
        headers: { "X-Review-Key": reviewKey },
        cache: "no-store"
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        if (response.status === 401) {
          reviewKey = "";
          $("dashboard").classList.add("hidden");
          $("auth-panel").classList.remove("hidden");
          $("auth-error").textContent = "認証に失敗しました。キーを確認してください。";
        } else {
          $("auth-error").textContent = data.error || "統計を読み込めませんでした。";
        }
        return false;
      }
      renderCards("trade-cards", [
        ["通常取引の申請", data.trades.total],
        ["承認済み", data.trades.approved],
        ["審査待ち", data.trades.pending],
        ["却下", data.trades.rejected]
      ]);
      renderCards("exchange-cards", [
        ["交換申請", data.exchanges.total],
        ["承認済み", data.exchanges.approved],
        ["審査待ち", data.exchanges.pending],
        ["却下", data.exchanges.rejected]
      ]);
      $("verified-items").textContent = fmt(data.verifiedItems);
      $("character-count").textContent = fmt(data.characterCount);
      $("all-submissions").textContent = fmt(Number(data.trades.total) + Number(data.exchanges.total));
      $("updated").textContent = "更新：" + new Date(data.generatedAt).toLocaleString("ja-JP");
      characters = Array.isArray(data.characters) ? data.characters : [];
      renderCharacters();
      $("auth-panel").classList.add("hidden");
      $("dashboard").classList.remove("hidden");
      return true;
    } catch (error) {
      $("auth-error").textContent = "接続できませんでした。通信環境を確認して再試行してください。";
      return false;
    } finally {
      $("refresh-button").disabled = false;
      $("login-button").disabled = false;
    }
  }
  $("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const key = $("key").value.trim();
    if (!key) return;
    reviewKey = key;
    $("login-button").disabled = true;
    await loadStatistics();
  });
  $("refresh-button").addEventListener("click", () => loadStatistics());
  $("search").addEventListener("input", renderCharacters);
})();
</script>
</body>
</html>
